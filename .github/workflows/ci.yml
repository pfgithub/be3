name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: clippy, fmt and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # block-app links GTK and WebKitGTK for the file picker and the embedded
      # browser, so the workspace does not compile without their headers.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - run: pwsh -File ./scripts/verify.ps1 -Check

  web:
    name: web bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The WASI sysroot is built against by clang, not by rustc, so the build
      # needs a local LLVM of at least version 17.
      - name: Install LLVM
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang-18 llvm-18
          echo /usr/lib/llvm-18/bin >> "$GITHUB_PATH"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@v2

      # The build script installs this itself when it is missing; a prebuilt one
      # is much faster. The version has to match the wasm-bindgen crate.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.122

      - name: Cache the WASI sysroot
        uses: actions/cache@v4
        with:
          path: target/tools
          key: wasi-sysroot-33

      - run: pwsh -File ./scripts/build-block-web.ps1 -Release

      - uses: actions/upload-artifact@v4
        with:
          name: block-web
          path: target/web
          retention-days: 14

  android:
    name: android apk
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image ships an Android SDK, but not the NDK release the app
      # is built against. The canary channel also lists the stable packages.
      - name: Install the Android SDK packages
        run: |
          sdkmanager="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" --channel=3 --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;29.0.14206865"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-apk
        run: cargo install cargo-apk --version 0.10.0 --locked

      # The development build signs with a throwaway keystore, the same one the
      # README has developers create by hand.
      - name: Create the debug keystore
        run: |
          mkdir -p target
          keytool -genkeypair -v \
            -keystore target/android-debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - run: pwsh -File ./scripts/build-block-android.ps1 -AndroidSdk "$ANDROID_SDK_ROOT"

      - uses: actions/upload-artifact@v4
        with:
          name: block-app-android-aarch64
          path: target/debug/apk/block-app.apk
          retention-days: 14

  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            client: true
          # The client needs GTK and WebKitGTK for the target architecture,
          # which Ubuntu only supplies through a multiarch sysroot, so only the
          # server is cross-compiled here.
          - name: linux-aarch64
            runner: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            client: false
          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            client: true
          - name: windows-aarch64
            runner: windows-latest
            target: aarch64-pc-windows-msvc
            client: true
          - name: macos-aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
            client: true
          - name: macos-x86_64
            runner: macos-latest
            target: x86_64-apple-darwin
            client: true
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        if: matrix.client && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      # rusqlite compiles SQLite from source, so the cross build needs a C
      # compiler and a linker for the target as well as the Rust std.
      - name: Install the aarch64 Linux toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-aarch64-linux-gnu
          {
            echo CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
            echo CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
            echo AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar
          } >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build the standalone server
        run: cargo build --release --target ${{ matrix.target }} -p block-server --bins

      - name: Build the client
        if: matrix.client
        run: cargo build --release --target ${{ matrix.target }} -p block-app --bins

      - name: Collect the binaries
        shell: bash
        run: |
          mkdir -p dist
          for binary in block-server block-app; do
            for path in "target/${{ matrix.target }}/release/$binary" \
                        "target/${{ matrix.target }}/release/$binary.exe"; do
              if [ -f "$path" ]; then cp "$path" dist/; fi
            done
          done
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: block-${{ matrix.name }}
          path: dist
          retention-days: 14
