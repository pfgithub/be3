name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: clippy, fmt and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # block-app links GTK and WebKitGTK for the file picker and the embedded
      # browser, and ALSA for audio playback, so the workspace does not
      # compile without their headers.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # libghostty-vt-sys builds libghostty-vt from source via Zig.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - run: ./scripts/verify.sh --check

  web:
    name: web bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # The WASI sysroot is built against by clang, not by rustc, so the build
      # needs a local LLVM of at least version 19: FreeType's setjmp/longjmp
      # calls are lowered by `-wasm-enable-sjlj`, and older LLVMs lower those
      # to env.saveSetjmp/testSetjmp/getTempRet0 JS imports that no browser
      # (and no import map here) provides. LLVM 19+ lowers them to
      # __wasm_setjmp/__wasm_setjmp_test/__wasm_longjmp instead, which resolve
      # entirely inside the wasm module against libsetjmp.a.
      - name: Install LLVM
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang-20 llvm-20
          echo /usr/lib/llvm-20/bin >> "$GITHUB_PATH"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      # CC_wasm32_wasip1 names the compiler as plain "clang", resolved through
      # PATH, so a cached target/ from a run with a different LLVM on PATH
      # looks unchanged to cargo's own rebuild detection and gets reused as
      # is. Keying the cache to the LLVM version forces a clean rebuild
      # whenever that version changes instead of silently linking old objects.
      - uses: Swatinem/rust-cache@v2
        with:
          key: llvm-20

      # The build script installs this itself when it is missing; a prebuilt one
      # is much faster. The version has to match the wasm-bindgen crate.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.122

      - name: Cache the WASI sysroot
        uses: actions/cache@v6
        with:
          path: target/tools
          key: wasi-sysroot-33

      - run: ./scripts/build-block-web.sh --release

      - uses: actions/upload-artifact@v7
        with:
          name: block-web
          path: target/web
          retention-days: 14

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: target/web

  pages:
    name: deploy github pages
    if: github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  android:
    name: android apk
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The runner image ships an Android SDK, but not the NDK release the app
      # is built against. The canary channel also lists the stable packages.
      - name: Install the Android SDK packages
        run: |
          sdkmanager="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" --channel=3 --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;29.0.14206865"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-apk
        run: cargo install cargo-apk --version 0.10.0 --locked

      # A freshly generated keystore would sign every CI build with a different
      # key, and Android refuses to install an update signed with a different
      # key than the one already on the device. Restore a persisted keystore
      # from a repo secret instead, so successive CI builds stay installable
      # as updates over one another. Fork PRs don't get repo secrets, so fall
      # back to a throwaway keystore there (and locally) just to keep the
      # build working; those builds won't share a key with the real ones.
      - name: Restore the debug keystore
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p target
          if [ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 -d > target/android-debug.keystore
          else
            keytool -genkeypair -v \
              -keystore target/android-debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      # A CI build sharing the app's real package name would either silently
      # overwrite a locally-built install (if it happened to share a signing
      # key) or block installation with a signature-mismatch error (since it
      # doesn't, now that the key is pinned in "Restore the debug keystore").
      # Give it its own application ID and label instead, so it installs
      # side by side with a local build rather than colliding with it.
      - name: Set a CI-only application ID
        run: |
          sed -i 's/^package = "com.be3.block"$/package = "com.be3.block.ci"/' crates/block-app/Cargo.toml
          sed -i 's/^label = "Block"$/label = "Block (CI)"/' crates/block-app/Cargo.toml

      - run: ./scripts/build-block-android.sh --android-sdk "$ANDROID_SDK_ROOT"

      - uses: actions/upload-artifact@v7
        with:
          name: block-app-android-aarch64
          path: target/debug/apk/block-app.apk
          retention-days: 14

  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            client: true
          # The client needs GTK and WebKitGTK for the target architecture,
          # which Ubuntu only supplies through a multiarch sysroot, so only the
          # server is cross-compiled here.
          - name: linux-aarch64
            runner: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            client: false
          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            client: true
          - name: windows-aarch64
            runner: windows-latest
            target: aarch64-pc-windows-msvc
            client: true
          - name: macos-aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
            client: true
          - name: macos-x86_64
            runner: macos-latest
            target: x86_64-apple-darwin
            client: true
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        if: matrix.client && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      # rusqlite compiles SQLite from source, so the cross build needs a C
      # compiler and a linker for the target as well as the Rust std. The cross
      # gcc only recommends the target libc headers, which --no-install-recommends
      # drops, and without them it falls back to the host's /usr/include.
      - name: Install the aarch64 Linux toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          {
            echo CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
            echo CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
            echo AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar
          } >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # libghostty-vt-sys builds libghostty-vt from source via Zig. The client
      # excludes it on Windows because it is not supported there, and on macOS
      # because the build is currently broken.
      - name: Install Zig
        if: matrix.client && runner.os == 'Linux'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Build the standalone server
        run: cargo build --release --target ${{ matrix.target }} -p block-server --bins

      - name: Build the client
        if: matrix.client
        run: cargo build --release --target ${{ matrix.target }} -p block-app --bins

      - name: Build and stage the desktop plugin
        if: matrix.client
        shell: bash
        run: |
          extension=''
          if [ "${{ runner.os }}" = Windows ]; then extension='.exe'; fi
          arguments=(
            --target "${{ matrix.target }}"
            --profile release
            --output dist/plugin-package
            --app-executable "target/${{ matrix.target }}/release/block-app$extension"
          )
          if [ "${{ runner.os }}" = macOS ]; then arguments+=(--sign-identity -); fi
          ./scripts/build-plugin-demo.sh "${arguments[@]}"

      - name: Collect the binaries
        shell: bash
        run: |
          mkdir -p dist
          for binary in block-server; do
            for path in "target/${{ matrix.target }}/release/$binary" \
                        "target/${{ matrix.target }}/release/$binary.exe"; do
              if [ -f "$path" ]; then cp "$path" dist/; fi
            done
          done
          if [ -d dist/plugin-package ]; then cp -R dist/plugin-package/. dist/; fi
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: block-${{ matrix.name }}
          path: dist
          retention-days: 14
