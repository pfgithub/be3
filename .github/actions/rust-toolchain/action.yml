name: Install the pinned Rust toolchain
description: >-
  Installs the toolchain rust-toolchain.toml pins, along with the targets and
  components a job needs.

inputs:
  targets:
    description: Comma-separated list of target triples to install
    required: false
    default: ''
  components:
    description: Comma-separated list of components to install
    required: false
    default: ''

runs:
  using: composite
  steps:
    # rustup runs whatever rust-toolchain.toml pins, while the install action
    # installs whatever it is asked for, and the two are only the same
    # toolchain when the version is read out of the file. Asking for "stable"
    # instead installs the targets and components under the name "stable",
    # which the pinned toolchain does not share even when it is the same
    # release: the build then fails on a missing target and clippy on a
    # missing component.
    - id: pin
      shell: bash
      run: |
        channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
        if [ -z "$channel" ]; then
          echo 'rust-toolchain.toml pins no channel to install' >&2
          exit 1
        fi
        echo "channel=$channel" >> "$GITHUB_OUTPUT"

    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.pin.outputs.channel }}
        targets: ${{ inputs.targets }}
        components: ${{ inputs.components }}
