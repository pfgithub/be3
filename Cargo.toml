[workspace]
members = [
    "crates/beui",
    "crates/tablet",
    "crates/reactive",
    "crates/block",
    "crates/block-server",
    "crates/block-client",
    "crates/text-editor-core",
    "crates/block-e2e",
    "crates/block-app",
    "crates/citygame",
    "crates/citygenerator",
    "crates/logicgame",
    "crates/cvl2",
    "crates/plugin-demo",
    "crates/block-plugin-api",
    "crates/gpui-demo",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.lints.clippy]
too_many_arguments = "allow"
