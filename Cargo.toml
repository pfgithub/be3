[workspace]
members = [
    "crates/beui",
    "crates/tablet",
    "crates/reactive",
    "crates/block",
    "crates/block-server",
    "crates/block-client",
    "crates/block-ui",
    "crates/text-editor-core",
    "crates/block-e2e",
    "crates/block-app",
    "crates/deterministic_games",
    "crates/citygame",
    "crates/citygenerator",
    "crates/logicgame",
    "crates/cvl2",
    "crates/editors/checklist",
    "crates/editors/counter",
    "crates/editors/hotbar",
    "crates/editors/image_block",
    "crates/editors/pdf",
    "crates/editors/pixel_art",
    "crates/editors/workspace_index",
    "crates/block-editor-plugin",
    "crates/block-plugin-api",
    "crates/gpui-demo",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.lints.clippy]
too_many_arguments = "allow"
