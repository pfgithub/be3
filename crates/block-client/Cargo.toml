[package]
name = "block-client"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22"
block = { path = "../block" }
eips = { version = "0.2.4", features = ["serde"] }
futures-channel = "0.3"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "pnm", "tga", "tiff", "webp"] }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only the synchronisation primitives are shared with the web build; they carry
# no runtime of their own and compile for wasm32.
tokio = { version = "1", features = ["sync"] }
uuid = { version = "1", features = ["serde", "v4"] }
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.23"
ureq = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
uuid = { version = "1", features = ["js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "BinaryType",
    "CloseEvent",
    "Event",
    "Headers",
    "MessageEvent",
    "Request",
    "RequestInit",
    "Response",
    "WebSocket",
    "Window",
    "console",
] }

[dev-dependencies]
block-server = { path = "../block-server" }
