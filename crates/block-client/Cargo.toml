[package]
name = "block-client"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22"
block = { path = "../block" }
chacha20poly1305 = "0.10"
eips = { version = "0.2.4", features = ["serde"] }
flate2 = "1"
futures-channel = "0.3"
futures-util = "0.3"
game-api = { path = "../tabletop_games/api" }
logicgame = { path = "../logicgame" }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Only the synchronisation primitives are shared with the web build; they carry
# no runtime of their own and compile for wasm32.
tokio = { version = "1", features = ["sync"] }
uuid = { version = "1", features = ["serde", "v4"] }

# A hosted client runs inside a wasm plugin: it reaches the server through the
# tunnel its host owns, so it wants neither a browser socket nor a browser
# executor. Its futures are polled by whoever calls pump().
[features]
hosted = []

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-webpki-roots"] }
ureq = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "BinaryType",
    "CloseEvent",
    "Event",
    "Headers",
    "MessageEvent",
    "Request",
    "RequestInit",
    "Response",
    "WebSocket",
    "Window",
    "console",
] }

[dev-dependencies]
block-server = { path = "../block-server" }

[lints]
workspace = true
