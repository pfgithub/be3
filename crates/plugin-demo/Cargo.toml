[package]
name = "plugin-demo"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "plugin-demo-host"
path = "src/main.rs"

[dependencies]
block-plugin-api = { path = "../block-plugin-api" }
eframe = { version = "0.34.3", default-features = false, features = ["default_fonts", "wgpu"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Performance",
    "Window",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem"] }

[lints]
workspace = true
