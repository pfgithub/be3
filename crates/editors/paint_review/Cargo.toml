[package]
name = "paint_review"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "paint_review-host"
path = "src/main.rs"

[dependencies]
block = { path = "../../block" }
block-client = { path = "../../block-client" }
block-editor-plugin = { path = "../../block-editor-plugin" }
paint-snapshot = { path = "../../paint-snapshot" }
serde_json = "1"
uuid = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Response", "Window", "WorkerGlobalScope"] }

[dev-dependencies]
block-ui-test = { path = "../../block-ui-test" }

[lints]
workspace = true
