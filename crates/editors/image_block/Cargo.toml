[package]
name = "image_block"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "image_block-host"
path = "src/main.rs"

[dependencies]
block-client = { path = "../../block-client" }
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "pnm", "tga", "tiff", "webp"] }
block-editor-plugin = { path = "../../block-editor-plugin", default-features = false }
uuid = "1"

[features]
default = ["native"]
native = ["block-editor-plugin/native"]
hosted = ["block-editor-plugin/hosted"]

[lints]
workspace = true
