[package]
name = "pixel_art"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "pixel_art-host"
path = "src/main.rs"

[dependencies]
block = { path = "../../block" }
block-client = { path = "../../block-client" }
block-editor-plugin = { path = "../../block-editor-plugin", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = "1"

[features]
default = ["native"]
native = ["block-editor-plugin/native"]
hosted = ["block-editor-plugin/hosted"]

[lints]
workspace = true
