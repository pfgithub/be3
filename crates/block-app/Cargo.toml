[package]
name = "block-app"
edition.workspace = true
version.workspace = true
license.workspace = true
autobins = false

[lib]
name = "block_app_lib"
path = "src/main.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "block-app"
path = "src/desktop.rs"

[package.metadata.android]
package = "com.be3.block"
apk_name = "block-app"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 23
target_sdk_version = 35

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[package.metadata.android.signing.dev]
path = "../../target/android-debug.keystore"
keystore_password = "android"

[package.metadata.android.application]
label = "Block"
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"

[package.metadata.android.application.activity]
config_changes = "orientation|keyboardHidden|screenSize|screenLayout"
exported = true

[dependencies]
block = { path = "../block" }
block-client = { path = "../block-client" }
block-plugin-api = { path = "../block-plugin-api" }
bytemuck = { version = "1.24.0", features = ["derive"] }
eframe = { version = "0.34.3", default-features = false, features = ["default_fonts", "persistence", "wgpu"] }
egui_dock = "0.19.1"
egui_material_icons = "0.6.0"
flate2 = "1"
freetype = "0.7"
harfbuzz_rs = "2"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "pnm", "tga", "tiff", "webp"] }
logicgame = { path = "../logicgame" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
text-editor-core = { path = "../text-editor-core" }
unicode-script = "0.5"
uuid = { version = "1", features = ["serde", "v4"] }

# Desktop and Android. The web build has no embedded server, no SQLite file to
# put app state in, and no blocking HTTP client.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
block-server = { path = "../block-server" }
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync"] }
ureq = { version = "2", features = ["gzip"] }
# rodio (via cpal) reaches ALSA/CoreAudio/WASAPI on desktop and Oboe on
# Android. The web build talks to the Web Audio API through web-sys directly
# instead: cpal's own Web Audio backend only targets wasm32-unknown-unknown,
# not this project's wasm32-wasip1 (see editors/audio/playback.rs).
rodio = "0.20"

# Desktop only: Android has neither an embedded browser nor an image clipboard,
# and the browser sandbox has neither.
[target.'cfg(all(not(target_os = "android"), not(target_arch = "wasm32")))'.dependencies]
arboard = "3.6"
eframe = { version = "0.34.3", default-features = false, features = ["wayland", "x11"] }
rfd = "0.15"
wry = "0.55.1"

[target.'cfg(all(unix, not(target_os = "android"), not(target_arch = "wasm32")))'.dependencies]
libc = "0.2"

# libghostty-vt is not supported on Windows, and is disabled on macOS because
# it does not currently build there.
[target.'cfg(not(any(target_os = "android", target_os = "windows", target_os = "macos", target_arch = "wasm32")))'.dependencies]
libghostty-vt = "0.2.1"
portable-pty = "0.9.0"

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30.13", features = ["android-native-activity"] }
# Used by the version-switching debug window to build the ContentResolver /
# Intent calls that download and install a GitHub Actions build.
jni = "0.22"
ndk-context = "0.1"
zip = { version = "8", default-features = false, features = ["deflate"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "CssStyleDeclaration",
    "Document",
    "Element",
    "Headers",
    "HtmlAudioElement",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlMediaElement",
    "Node",
    "Request",
    "RequestInit",
    "Response",
    "Storage",
    "Url",
    "Window",
    "console",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_UI_Input_KeyboardAndMouse"] }

[lints]
workspace = true
