[package]
name = "block-plugin"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
block-plugin-api = { path = "../block-plugin-api" }
eframe = { version = "0.34.3", default-features = false, features = ["default_fonts", "wgpu"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlCanvasElement", "Performance", "Window"] }

[target.'cfg(target_os = "windows")'.dependencies]
pollster = "0.4"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi_Common", "Win32_Security"] }
wgpu-hal = { version = "29", features = ["dx12"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Threading"] }

[lints]
workspace = true
